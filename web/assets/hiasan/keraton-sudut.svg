<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ranting bunga melati & daun berwarna emas, tumbuh dari sudut kiri atas (template Keraton) -->
  <defs>
    <linearGradient id="emas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E2A6"/>
      <stop offset=".5" stop-color="#CFA250"/>
      <stop offset="1" stop-color="#8F6A2D"/>
    </linearGradient>
    <path id="daun" d="M0 0 C7 -8 20 -8 28 0 C20 8 7 8 0 0Z"/>
    <g id="melati">
      <ellipse cx="0" cy="-5.5" rx="3.4" ry="5.8"/>
      <ellipse cx="0" cy="-5.5" rx="3.4" ry="5.8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-5.5" rx="3.4" ry="5.8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-5.5" rx="3.4" ry="5.8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-5.5" rx="3.4" ry="5.8" transform="rotate(288)"/>
      <circle r="2.2" fill="#FFF4D2"/>
    </g>
  </defs>

  <!-- Tangkai -->
  <g fill="none" stroke="url(#emas)" stroke-linecap="round">
    <path d="M0 8 C38 22 66 52 86 94 C98 120 106 148 110 184" stroke-width="2.2"/>
    <path d="M8 0 C48 10 92 24 128 52 C150 68 168 86 188 96" stroke-width="2.2"/>
    <path d="M44 31 C40 52 44 70 56 86" stroke-width="1.4"/>
    <path d="M72 19 C90 17 106 21 120 31" stroke-width="1.4"/>
    <path d="M96 120 C108 124 118 132 124 144" stroke-width="1.2"/>
  </g>

  <!-- Daun -->
  <g fill="url(#emas)">
    <use href="#daun" transform="translate(22 14) rotate(-15)"/>
    <use href="#daun" transform="translate(40 26) rotate(75)"/>
    <use href="#daun" transform="translate(62 46) rotate(10)"/>
    <use href="#daun" transform="translate(76 70) rotate(100)"/>
    <use href="#daun" transform="translate(90 102) rotate(30)"/>
    <use href="#daun" transform="translate(99 128) rotate(118)"/>
    <use href="#daun" transform="translate(106 156) rotate(40)"/>
    <use href="#daun" transform="translate(34 7) rotate(70)"/>
    <use href="#daun" transform="translate(64 14) rotate(-30)"/>
    <use href="#daun" transform="translate(96 28) rotate(75)"/>
    <use href="#daun" transform="translate(122 46) rotate(-10)"/>
    <use href="#daun" transform="translate(146 64) rotate(85)"/>
    <use href="#daun" transform="translate(166 82) rotate(5)"/>
    <use href="#daun" transform="translate(48 60) rotate(140) scale(.75)"/>
    <use href="#daun" transform="translate(98 22) rotate(-50) scale(.7)"/>
  </g>

  <!-- Bunga & kuncup -->
  <g fill="url(#emas)">
    <use href="#melati" transform="translate(110 184) scale(1.5)"/>
    <use href="#melati" transform="translate(188 96) scale(1.5)"/>
    <use href="#melati" transform="translate(56 86) scale(1.1)"/>
    <use href="#melati" transform="translate(120 31) scale(1.1)"/>
    <use href="#melati" transform="translate(124 144) scale(.9)"/>
    <ellipse cx="52" cy="98" rx="2.6" ry="4.4" transform="rotate(-20 52 98)"/>
    <ellipse cx="132" cy="27" rx="2.6" ry="4.4" transform="rotate(60 132 27)"/>
    <ellipse cx="116" cy="196" rx="2.4" ry="4" transform="rotate(-10 116 196)"/>
    <ellipse cx="196" cy="104" rx="2.4" ry="4" transform="rotate(-60 196 104)"/>
  </g>
</svg>
